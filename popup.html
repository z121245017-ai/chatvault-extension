<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatVault - DeepSeek 对话导出</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <img src="icons/icon48.png" alt="ChatVault" class="brand-icon" width="28" height="28" />
        <div>
          <h1 class="brand-title">ChatVault <span class="brand-tag">v1.1</span></h1>
          <p class="brand-sub">DeepSeek 对话导出 Markdown</p>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" id="btnOpenCoffeeTop" class="coffee-top-link" title="支持 ChatVault 免费持续维护">☕ 请作者喝咖啡</button>
        <span class="privacy-pill" title="connect-src 'none' · 不向任何服务器发送数据">本地运行</span>
      </div>
    </header>

    <div id="statusBanner" class="status-banner is-hidden" role="status"></div>

    <section class="summary-card">
      <div class="summary-top">
        <span id="platformBadge" class="platform-badge">检测中</span>
        <span id="convTitle" class="conv-title" title="当前对话标题">等待读取对话...</span>
      </div>
      <div class="stats-row">
        <span id="statusPill" class="status-pill" data-status="pending">读取中</span>
        <span class="stat-chip" id="statMessages">0 条消息</span>
        <span class="stat-chip" id="statReasoning">0 思考块</span>
      </div>
      <dl class="range-list" id="rangeList">
        <div class="range-row"><dt>来源</dt><dd id="rangeSource">-</dd></div>
        <div class="range-row"><dt>首条</dt><dd id="rangeFirst">-</dd></div>
        <div class="range-row"><dt>末条</dt><dd id="rangeLast">-</dd></div>
      </dl>
      <ul class="range-reasons is-hidden" id="rangeReasons"></ul>
    </section>

    <section class="cta-panel">
      <button type="button" id="btnExportMd" class="btn btn-primary btn-cta">
        一键导出 Markdown
      </button>
      <div class="secondary-grid">
        <button type="button" id="btnCopyMd" class="btn btn-ghost">复制 Markdown</button>
        <button type="button" id="btnExportJson" class="btn btn-ghost">导出 JSON</button>
      </div>
    </section>

    <details class="options-card">
      <summary class="options-summary">导出选项</summary>
      <label class="toggle-row" for="toggleFrontmatter">
        <span class="toggle-copy">
          <strong>写入文件头信息（YAML）</strong>
          <small>标题、来源、导出时间、条数与完整性状态</small>
        </span>
        <input type="checkbox" id="toggleFrontmatter" checked />
      </label>
      <label class="toggle-row" for="toggleReasoning">
        <span class="toggle-copy">
          <strong>保留 DeepSeek 思考过程</strong>
          <small>折叠为 &lt;details&gt;&lt;summary&gt;Reasoning&lt;/summary&gt; 块</small>
        </span>
        <input type="checkbox" id="toggleReasoning" checked />
      </label>
      <label class="toggle-row" for="toggleScrollCollect">
        <span class="toggle-copy">
          <strong>滚动校验完整性</strong>
          <small>从顶部滚到底逐屏核对；关闭后只读取当前已加载的部分</small>
        </span>
        <input type="checkbox" id="toggleScrollCollect" checked />
      </label>
    </details>

    <section class="preview-card">
      <div class="preview-head">
        <h2>Markdown 预览</h2>
        <div class="preview-actions">
          <button type="button" id="btnRefreshPage" class="btn btn-xs btn-ghost">重新读取</button>
          <button type="button" id="btnLoadSample" class="btn btn-xs btn-secondary">载入示例</button>
        </div>
      </div>
      <pre id="markdownPreview" class="md-preview">正在读取当前标签页中的 DeepSeek 对话...</pre>
    </section>

    <footer class="support-bar" id="supportBar">
      <div id="coffeeFooterCard" class="coffee-footer-card">
        <div class="coffee-footer-text">
          <span class="coffee-cup" aria-hidden="true">☕</span>
          <span><strong>请作者喝咖啡</strong> · 支持免费持续维护</span>
        </div>
        <button type="button" id="btnOpenCoffeeFooter" class="btn btn-xs btn-emerald">支持</button>
      </div>
      <button type="button" id="btnReopenCoffee" class="coffee-thanks-pill is-hidden">
        已收到支持 · 感谢请作者喝咖啡 ☕
      </button>
    </footer>
  </div>

  <div id="coffeeModal" class="modal-backdrop is-hidden" role="dialog" aria-modal="true" aria-labelledby="coffeeModalTitle">
    <div class="modal-card">
      <div class="modal-head">
        <span id="coffeeModalTitle" class="modal-eyebrow">SUPPORT / 支持 ChatVault 持续维护</span>
        <button type="button" id="btnCloseCoffee" class="modal-close" aria-label="关闭弹窗">×</button>
      </div>
      <p class="modal-desc">
        ChatVault 在本地运行，不上传对话、不加水印、不需要登录。如果它帮你存下了重要的对话，欢迎微信扫码请作者喝杯咖啡。
      </p>
      <div class="modal-qr-wrap">
        <img src="assets/wechat-coffee-light.png" alt="若言(*帆) 微信赞赏码" class="modal-qr-img" />
      </div>
      <div class="modal-actions">
        <button type="button" id="btnCoffeeLater" class="btn btn-ghost">以后再说</button>
        <button type="button" id="btnCoffeeSupported" class="btn btn-emerald-solid">我已打赏</button>
      </div>
    </div>
  </div>

  <script src="src/samples/builtin_sample.js"></script>
  <script src="src/extractor/chat_extractor.js"></script>
  <script src="src/formatter/markdown_exporter.js"></script>
  <script src="popup.js"></script>
</body>
</html>
